    <style>
      /* Paint the right background before the CSS bundle loads (no white flash in dark mode). */
      html { background: #f4f8ff; }
      @media (prefers-color-scheme: dark) { html { background: #070d1a; } }

      /* App-start intro: plain CSS, so it plays while the app loads underneath instead of
         delaying it. Taps go straight through (pointer-events: none). About 1.3 s in all. */
      #intro {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #f4f8ff; pointer-events: none;
        animation: intro-out 0.35s ease-in 0.95s forwards;
      }
      #intro img {
        width: min(260px, 64vw); height: auto;
        animation: intro-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both, intro-glow 0.9s ease-out 0.15s both;
      }
      @media (prefers-color-scheme: dark) { #intro { background: #070d1a; } }
      :root[data-theme='dark'] #intro { background: #070d1a; }
      :root[data-theme='light'] #intro { background: #f4f8ff; }
      .no-intro #intro { display: none; }
      @keyframes intro-pop { 0% { opacity: 0; transform: scale(0.55); } 60% { opacity: 1; transform: scale(1.08); } 100% { transform: scale(1); } }
      @keyframes intro-glow {
        0% { filter: drop-shadow(0 0 0 rgba(18, 160, 248, 0)); }
        45% { filter: drop-shadow(0 0 28px rgba(18, 160, 248, 0.55)) drop-shadow(0 0 10px rgba(255, 198, 26, 0.45)); }
        100% { filter: drop-shadow(0 8px 24px rgba(11, 107, 246, 0.18)); }
      }
      @keyframes intro-out { to { opacity: 0; visibility: hidden; } }
      /* Reduce Motion: no pop or glow, just a quick fade. */
      @media (prefers-reduced-motion: reduce) {
        #intro img { animation: intro-fade 0.3s ease-out both; }
        #intro { animation: intro-out 0.3s ease-in 0.6s forwards; }
      }
      @keyframes intro-fade { from { opacity: 0; } }
    </style>
    <script>
      // Skip the intro if the app was open in the last few minutes (main.tsx keeps this fresh),
      // and in browser tests unless they ask for it (?test&intro), so it isn't in their screenshots.
      try {
        var last = Number(localStorage.getItem('intro-last')) || 0;
        var test = /[?&]test\b/.test(location.search) && !/[?&]intro\b/.test(location.search);
        if (test || Date.now() - last < 5 * 60 * 1000) document.documentElement.classList.add('no-intro');
        localStorage.setItem('intro-last', String(Date.now()));
      } catch (e) {}
    </script>
